<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ska & Jazz Groove Machine</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; }
.step { width:30px; height:30px; margin:2px; display:inline-block;
        background:#333; cursor:pointer; }
.step.on { background:#e33; }
.row { margin:10px 0; }
</style>
</head>
<body>

<h2>Ska & Jazz Groove Machine</h2>

<select id="patternSel">
  <option value="none">リズムを選択</option>
  <option value="ska">スカ</option>
  <option value="jazz">ジャズ</option>
</select>
<button id="setBtn">セット</button>
<button id="playBtn">PLAY</button>
<button id="stopBtn">STOP</button>

<div class="row" id="kickRow"></div>
<div class="row" id="snareRow"></div>
<div class="row" id="hatRow"></div>
<div class="row" id="guitarRow"></div>
<div class="row" id="hornRow"></div>
<div class="row" id="bassRow"></div>

<script>
const audio = new (window.AudioContext || window.webkitAudioContext)();
const steps = 16;
let loopTimer = null;

// UI生成
function makeRow(id){
  const row = document.getElementById(id);
  for(let i=0;i<steps;i++){
    const div=document.createElement("div");
    div.className="step";
    div.dataset.step=i;
    div.onclick=()=>div.classList.toggle("on");
    row.appendChild(div);
  }
}
makeRow("kickRow");
makeRow("snareRow");
makeRow("hatRow");
makeRow("guitarRow");
makeRow("hornRow");
makeRow("bassRow");

// 全OFF
function clearAll(){
  ["kickRow","snareRow","hatRow","guitarRow","hornRow","bassRow"].forEach(id=>{
    [...document.getElementById(id).children].forEach(s=>s.classList.remove("on"));
  });
}

// スカホーンのランダム生成
function setRandomHornPattern(horn){
  horn.forEach(s => s.classList.remove("on"));
  const type = Math.floor(Math.random() * 3);

  if(type === 0){
    [0,2,4,6].forEach(i => horn[i].classList.add("on"));
  } else if(type === 1){
    [6,4,2,0].forEach(i => horn[i].classList.add("on"));
  } else {
    [1,3,7,11].forEach(i => horn[i].classList.add("on"));
  }
}

// リズムセット
document.getElementById("setBtn").onclick=()=>{
  clearAll();
  const pat=document.getElementById("patternSel").value;

  const kick=[...document.getElementById("kickRow").children];
  const snare=[...document.getElementById("snareRow").children];
  const hat=[...document.getElementById("hatRow").children];
  const guitar=[...document.getElementById("guitarRow").children];
  const horn=[...document.getElementById("hornRow").children];
  const bass=[...document.getElementById("bassRow").children];

  if(pat==="ska"){
    // 裏拍ハット
    [1,3,5,7,9,11,13,15].forEach(i=>hat[i].classList.add("on"));

    // スカキック
    [0,12].forEach(i=>kick[i].classList.add("on"));

    // スネア
    [4,12].forEach(i=>snare[i].classList.add("on"));

    // ギター裏打ち
    [1,3,5,7,9,11,13,15].forEach(i=>guitar[i].classList.add("on"));

    // ランダムホーン
    setRandomHornPattern(horn);

    // ベース（オフビート）
    [1,3,5,7,9,11,13,15].forEach(i=>bass[i].classList.add("on"));
  }

  if(pat==="jazz"){
    // スイングハット
    [0,3,6,9,12,15].forEach(i=>hat[i].classList.add("on"));

    // 軽キック
    kick[0].classList.add("on");

    // 裏スネア
    snare[6].classList.add("on");

    // ジャズギター（コンピング）
    [1,3,5,7,9,11,13,15].forEach(i=>guitar[i].classList.add("on"));

    // ブラシスネア
    [2,10].forEach(i=>snare[i].classList.add("on"));

    // ウォーキングベース
    [0,4,8,12].forEach(i=>bass[i].classList.add("on"));

    // ホーンはジャズでは使わない（OFF）
  }
};

// --- 音源 ---
function playKick(time){
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.frequency.setValueAtTime(180, time);
  osc.frequency.exponentialRampToValueAtTime(55, time+0.08);
  gain.gain.setValueAtTime(1.2, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time+0.12);
  osc.connect(gain).connect(audio.destination);
  osc.start(time); osc.stop(time+0.15);
}

function playSnare(time){
  const noise=audio.createBufferSource();
  const buffer=audio.createBuffer(1, audio.sampleRate*0.2, audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  noise.buffer=buffer;
  const gain=audio.createGain();
  gain.gain.setValueAtTime(1, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time+0.2);
  noise.connect(gain).connect(audio.destination);
  noise.start(time); noise.stop(time+0.2);
}

function playHat(time){
  const noise=audio.createBufferSource();
  const buffer=audio.createBuffer(1, audio.sampleRate*0.05, audio.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
  noise.buffer=buffer;
  const gain=audio.createGain();
  gain.gain.setValueAtTime(0.5, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time+0.05);
  noise.connect(gain).connect(audio.destination);
  noise.start(time); noise.stop(time+0.05);
}

function playGuitar(time){
  const noise = audio.createBufferSource();
  const buffer = audio.createBuffer(1, audio.sampleRate*0.02, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = Math.random()*2 - 1;
  noise.buffer = buffer;

  const hp = audio.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.setValueAtTime(1800, time);

  const gain = audio.createGain();
  gain.gain.setValueAtTime(1.0, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

  noise.connect(hp).connect(gain).connect(audio.destination);
  noise.start(time);
  noise.stop(time + 0.04);
}

function playHorn(time){
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(500, time);
  osc.frequency.exponentialRampToValueAtTime(900, time + 0.08);
  gain.gain.setValueAtTime(1.0, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
  osc.connect(gain).connect(audio.destination);
  osc.start(time);
  osc.stop(time + 0.15);
}

function playBass(time){
  // 低音
  const osc1 = audio.createOscillator();
  osc1.type = "sine";
  osc1.frequency.setValueAtTime(120, time);
  osc1.frequency.exponentialRampToValueAtTime(160, time + 0.06);

  const noise1 = audio.createBufferSource();
  const buffer1 = audio.createBuffer(1, audio.sampleRate*0.01, audio.sampleRate);
  const data1 = buffer1.getChannelData(0);
  for(let i=0;i<data1.length;i++) data1[i] = Math.random()*2 - 1;
  noise1.buffer = buffer1;

  const hp1 = audio.createBiquadFilter();
  hp1.type = "highpass";
  hp1.frequency.setValueAtTime(800, time);

  const gain1 = audio.createGain();
  gain1.gain.setValueAtTime(1.2, time);
  gain1.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

  osc1.connect(gain1).connect(audio.destination);
  noise1.connect(hp1).connect(gain1);

  osc1.start(time);
  osc1.stop(time + 0.18);
  noise1.start(time);
  noise1.stop(time + 0.05);

  // オクターブ上
  const osc2 = audio.createOscillator();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(240, time + 0.18);

  const gain2 = audio.createGain();
  gain2.gain.setValueAtTime(0.9, time + 0.18);
  gain2.gain.exponentialRampToValueAtTime(0.001, time + 0.30);

  osc2.connect(gain2).connect(audio.destination);
  osc2.start(time + 0.18);
  osc2.stop(time + 0.32);
}

// --- ループ再生 ---
function playLoop(){
  const kick=[...document.getElementById("kickRow").children];
  const snare=[...document.getElementById("snareRow").children];
  const hat=[...document.getElementById("hatRow").children];
  const guitar=[...document.getElementById("guitarRow").children];
  const horn=[...document.getElementById("hornRow").children];
  const bass=[...document.getElementById("bassRow").children];

  const bpm=120;
  const interval=60/bpm/4;

  let step = 0;

  loopTimer = setInterval(()=>{
    const t = audio.currentTime;

    if(kick[step].classList.contains("on")) playKick(t);
    if(snare[step].classList.contains("on")) playSnare(t);
    if(hat[step].classList.contains("on")) playHat(t);
    if(guitar[step].classList.contains("on")) playGuitar(t);
    if(horn[step].classList.contains("on")) playHorn(t);
    if(bass[step].classList.contains("on")) playBass(t);

    step = (step + 1) % 16;
  }, interval * 1000);
}

document.getElementById("playBtn").onclick = ()=>{
  if(loopTimer) clearInterval(loopTimer);
  playLoop();
};

document.getElementById("stopBtn").onclick = ()=>{
  if(loopTimer){
    clearInterval(loopTimer);
    loopTimer = null;
  }
};
</script>
</body>
</html>
